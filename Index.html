<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#7b3f5b">
  <title>Petal & Vine | Flower Shop</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div id="toast" class="toast"></div>

  <section id="authScreen" class="auth-screen">
    <div class="auth-card">
      <div class="brand-mark">✿</div>
      <h1>Petal & Vine</h1>
      <p class="muted">Flowers for every beautiful moment.</p>

      <div class="auth-tabs">
        <button id="loginTab" class="tab active" type="button">Login</button>
        <button id="registerTab" class="tab" type="button">Register</button>
      </div>

      <form id="loginForm">
        <label>Username or email</label>
        <input id="loginUsername" required autocomplete="username">
        <label>Password</label>
        <input id="loginPassword" type="password" required autocomplete="current-password">
        <button class="primary-btn full" type="submit">Login</button>
      </form>

      <form id="registerForm" class="hidden">
        <label>Full name</label>
        <input id="registerName" required>
        <label>Email</label>
        <input id="registerEmail" type="email" required>
        <label>Username</label>
        <input id="registerUsername" required>
        <label>Password</label>
        <input id="registerPassword" type="password" minlength="4" required>
        <button class="primary-btn full" type="submit">Create account</button>
      </form>

      <p class="auth-note">Admin demo login: <b>admin</b> / <b>Admin123</b></p>
    </div>
  </section>

  <div id="mainApp" class="app hidden">
    <aside class="sidebar">
      <div class="side-brand">
        <span>✿</span>
        <div><b>Petal & Vine</b><small>Flower Shop</small></div>
      </div>

      <div id="sideUser" class="side-user"></div>
      <nav id="navigation"></nav>
      <button id="logoutBtn" class="logout-btn" type="button">↪ Log out</button>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div>
          <p class="eyebrow">PETAL & VINE</p>
          <h2 id="pageTitle">Dashboard</h2>
        </div>
        <div id="topUser" class="top-user"></div>
      </header>
      <section id="pageContent"></section>
    </main>
  </div>

  <div id="productModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-heading">
        <h3 id="productModalTitle">Add product</h3>
        <button class="icon-btn" type="button" onclick="closeProductModal()">×</button>
      </div>
      <form id="productForm">
        <input id="productId" type="hidden">
        <label>Product name</label>
        <input id="productName" required>
        <label>Description</label>
        <textarea id="productDescription" rows="3"></textarea>
        <div class="form-grid">
          <div><label>Price (₱)</label><input id="productPrice" type="number" min="0" step="0.01" required></div>
          <div><label>Stock</label><input id="productStock" type="number" min="0" step="1" required></div>
        </div>
        <label>Category</label>
        <input id="productCategory" placeholder="Bouquet">
        <label>Product picture</label>
        <input id="productImage" type="file" accept="image/*">
        <img id="imagePreview" class="image-preview hidden" alt="Product preview">
        <button class="primary-btn full" type="submit">Save product</button>
      </form>
    </div>
  </div>

  <div id="receiptModal" class="modal hidden">
    <div class="modal-card receipt-card">
      <div class="modal-heading">
        <h3>Receipt</h3>
        <button class="icon-btn" type="button" onclick="closeReceipt()">×</button>
      </div>
      <div id="receiptContent"></div>
      <button class="primary-btn full no-print" type="button" onclick="window.print()">Print receipt</button>
    </div>
  </div>
</body>
</html>
